# Guardian V1 — Project Brain (NOT CONFIGURED YET)
# Checks report ERROR G010 until modules exist. To configure, tell your AI agent:
#   Run `python3 .guardian/guardian.py onboard` and follow it.
# Semantics: header of guardian.py. Examples: README (section 5).
# Unknown keys are a config ERROR (typos never silently disable a rule).

# Top-level keys must stay above the first [table].
ignore = []

[project]
name = ""

# Import prefix -> repo path. Longest prefix wins. Unmatched non-relative imports are external.
# js: relative imports need no config. py default: {"" = ""}. php/go: required if present.
[resolve]
# js  = { "@/" = "src/" }
# php = { 'App\' = "app/" }
# go  = { "github.com/acme/app/" = "" }

# Modules: "<literal dir>/**", no nesting/overlap. depends is required ([] = none).
# [modules.shared]
# paths = ["src/shared/**"]
# depends = []

# Calibration: enforced rules start as "warn" for ~1 week, then "block".
[[rules]]
id = "DEPS"
type = "module_deps"
severity = "warn"
msg = "Module dependency outside depends"
