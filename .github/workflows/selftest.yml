name: selftest
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # desteklenen en düşük sürüm
      - run: python3 guardian.py --selftest
      - run: python3 -m unittest discover -s tests -v
